name: Crash report
description: The game closed, froze, or crashed unexpectedly.
title: "[Crash] "
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can. Do not include passwords, Steam Guard codes, or payment details.
  - type: input
    id: version
    attributes:
      label: Game version
      description: The version shown in the game, on the store page, or in the install folder.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Steam Deck
        - Other
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What you were doing
      description: What happened just before the crash.
    validations:
      required: true
  - type: textarea
    id: crash_log
    attributes:
      label: Crash log
      description: Paste the crash log if you have one. Do not include passwords, Steam Guard codes, or payment details.
      render: shell
    validations:
      required: false
