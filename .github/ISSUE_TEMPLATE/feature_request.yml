name: Feature request
description: Suggest an idea or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like to see added or changed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: How this would improve the game for you or other players.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Examples, screenshots, or anything else that would help explain the idea.
    validations:
      required: false
